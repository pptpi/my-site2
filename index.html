<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="confessions.html">Confessions</a>
    <a href="scriptures.html">Scriptures</a>
  </nav>

  <main>
    <h1>Confessions &amp; Scriptures</h1>
    <p>Click the links above, or jump straight in:</p>
    <ul>
      <li><a href="confessions.html">Confessions</a></li>
      <li><a href="scriptures.html">Scriptures</a></li>
    </ul>
  </main>

  <div class="font-bar">
    <label for="font">Font:</label>
    <select id="font">
      <option value='"Times New Roman", Times, serif' selected>Times New Roman</option>
      <option value="Verdana, sans-serif">Verdana</option>
      <option value='"Courier New", Courier, monospace">Courier New</option>
    </select>
  </div>

  <script>
    const select = document.getElementById("font");
    select.addEventListener("change", () => {
      document.body.style.fontFamily = select.value;
      localStorage.setItem("preferredFont", select.value);
    });
    const saved = localStorage.getItem("preferredFont");
    if (saved) {
      document.body.style.fontFamily = saved;
      select.value = saved;
    }
  </script>
</body>
</html>
